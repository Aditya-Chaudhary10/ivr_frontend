<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novah Voice Assistant</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #166088;
            --accent-color: #4fc3dc;
            --background-color: #1a1e24;
            --text-color: #e6e6e6;
            --border-color: #2a2e35;
            --user-message-bg: #2c3e50;
            --assistant-message-bg: #1e3a2e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .subtitle {
            color: #888;
            margin-top: 0;
        }

        .language-selector {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .language-selector label {
            margin-right: 10px;
        }

        .language-selector select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: #2a2e35;
            color: var(--text-color);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .record-btn {
            background-color: #e74c3c;
            color: white;
        }

        .record-btn.recording {
            background-color: #c0392b;
            animation: pulse 1.5s infinite;
        }

        .reset-btn {
            background-color: #3498db;
            color: white;
        }

        .speak-btn {
            background-color: #2ecc71;
            color: white;
        }

        .save-btn {
            background-color: #9b59b6;
            color: white;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }

        .icon {
            margin-right: 8px;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        .status-container {
            text-align: center;
            min-height: 30px;
            margin-bottom: 20px;
        }

        .loading-dots {
            display: inline-flex;
            margin-left: 10px;
        }

        .loading-dots div {
            width: 8px;
            height: 8px;
            margin: 0 4px;
            border-radius: 50%;
            background-color: var(--text-color);
            animation: dots 1.4s infinite ease-in-out both;
        }

        .loading-dots div:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots div:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes dots {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .wave-container {
            display: inline-flex;
            align-items: flex-end;
            height: 20px;
            margin-right: 10px;
        }

        .wave-bar {
            width: 4px;
            height: 100%;
            margin: 0 2px;
            background-color: var(--accent-color);
            animation: wave 0.5s infinite ease-in-out alternate;
            transform-origin: bottom;
        }

        @keyframes wave {
            0% {
                transform: scaleY(0.3);
            }
            100% {
                transform: scaleY(1);
            }
        }

        .chat-container {
            background-color: #2a2e35;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            max-width: 80%;
        }

        .user-message {
            background-color: var(--user-message-bg);
            margin-left: auto;
            border-top-right-radius: 0;
        }

        .assistant-message {
            background-color: var(--assistant-message-bg);
            margin-right: auto;
            border-top-left-radius: 0;
        }

        .message-header {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .audio-player {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .audio-player audio {
            flex: 1;
            border-radius: 5px;
            background-color: #2a2e35;
        }

        .settings {
            background-color: #2a2e35;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .settings h3 {
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .setting-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .setting-item label {
            min-width: 80px;
        }

        .setting-item select,
        .setting-item input {
            flex: 1;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: #3a3e45;
            color: var(--text-color);
        }

        .setting-item span {
            margin-left: 10px;
            min-width: 30px;
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e74c3c;
            margin-left: 10px;
        }

        .duration-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .duration-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            background-color: #34495e;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .duration-btn:hover {
            background-color: #2c3e50;
        }

        .duration-btn.active {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ Novah <span style="margin-left: 10px;">🤖</span></h1>
            <p class="subtitle">Powered by Groq + LLaMA 3.3 70B</p>
        </header>

        <div class="language-selector">
            <label for="language">Language:</label>
            <select id="language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
            </select>
        </div>

        <div class="duration-buttons">
            <button id="duration3s" class="duration-btn active">3s</button>
            <button id="duration5s" class="duration-btn">5s</button>
            <button id="duration10s" class="duration-btn">10s</button>
            <button id="durationContinuous" class="duration-btn">Continuous</button>
        </div>

        <div class="controls">
            <button id="recordButton" class="btn record-btn">
                <span class="icon">🎙️</span> Record
            </button>
            <button id="resetButton" class="btn reset-btn">
                <span class="icon">🔄</span> Reset
            </button>
            <span id="recordingTimer" class="timer" style="display: none;">00:00</span>
        </div>

        <div id="status" class="status-container"></div>

        <div class="chat-container" id="chatContainer">
            <!-- Chat messages will appear here -->
            <div class="message assistant-message">
                <div class="message-header">🤖 Assistant:</div>
                <div>I'm here to help. How can I assist you today?</div>
            </div>
        </div>

        <div class="audio-player">
            <audio id="audioPlayback" controls></audio>
            <button id="speakButton" class="btn speak-btn" style="display: none;">
                <span class="icon">🔊</span> Listen
            </button>
        </div>

        <div class="settings">
            <h3>Voice Settings</h3>
            <div class="setting-item">
                <label for="speed">Speed:</label>
                <select id="speed">
                    <option value="0.75">Slow</option>
                    <option value="1.0" selected>Normal</option>
                    <option value="1.25">Fast</option>
                    <option value="1.5">Very Fast</option>
                </select>
            </div>
            <div class="setting-item">
                <label for="volume">Volume:</label>
                <input type="range" id="volume" min="0.5" max="2.0" step="0.1" value="1.0">
                <span id="volumeValue">1.0</span>
            </div>
            <button id="saveButton" class="btn save-btn">
                <span class="icon">💾</span> Save Conversation
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const recordButton = document.getElementById('recordButton');
            const resetButton = document.getElementById('resetButton');
            const speakButton = document.getElementById('speakButton');
            const saveButton = document.getElementById('saveButton');
            const languageSelect = document.getElementById('language');
            const speedSelect = document.getElementById('speed');
            const volumeInput = document.getElementById('volume');
            const volumeValue = document.getElementById('volumeValue');
            const audioPlayback = document.getElementById('audioPlayback');
            const chatContainer = document.getElementById('chatContainer');
            const statusContainer = document.getElementById('status');
            const recordingTimer = document.getElementById('recordingTimer');
            
            // Duration buttons
            const duration3s = document.getElementById('duration3s');
            const duration5s = document.getElementById('duration5s');
            const duration10s = document.getElementById('duration10s');
            const durationContinuous = document.getElementById('durationContinuous');

            // State variables
            let mediaRecorder;
            let audioChunks = [];
            let isRecording = false;
            let recordingDuration = 3; // Default 3 seconds
            let isContinuous = false;
            let recordingStartTime;
            let timerInterval;
            let messages = [{
                "role": "system",
                "content": "You are a helpful voice assistant that can respond in multiple languages. Keep your responses concise for easier listening."
            }];
            let lastResponse = "";

            // Duration button handlers
            duration3s.addEventListener('click', function() {
                setDuration(3, false);
            });
            
            duration5s.addEventListener('click', function() {
                setDuration(5, false);
            });
            
            duration10s.addEventListener('click', function() {
                setDuration(10, false);
            });
            
            durationContinuous.addEventListener('click', function() {
                setDuration(0, true);
            });
            
            function setDuration(duration, continuous) {
                recordingDuration = duration;
                isContinuous = continuous;
                
                // Update active button
                [duration3s, duration5s, duration10s, durationContinuous].forEach(btn => {
                    btn.classList.remove('active');
                });
                
                if (continuous) {
                    durationContinuous.classList.add('active');
                } else if (duration === 3) {
                    duration3s.classList.add('active');
                } else if (duration === 5) {
                    duration5s.classList.add('active');
                } else if (duration === 10) {
                    duration10s.classList.add('active');
                }
            }

            // Update volume display
            volumeInput.addEventListener('input', function() {
                volumeValue.textContent = this.value;
            });

            // Record button click handler
            recordButton.addEventListener('click', async function() {
                if (isRecording) {
                    stopRecording();
                } else {
                    await startRecording();
                }
            });

            // Reset button click handler
            resetButton.addEventListener('click', function() {
                messages = [{
                    "role": "system",
                    "content": "You are a helpful voice assistant that can respond in multiple languages. Keep your responses concise for easier listening."
                }];
                chatContainer.innerHTML = '';
                // Add initial assistant message
                addMessage('assistant', "I'm here to help. How can I assist you today?");
                speakButton.style.display = 'none';
                statusContainer.innerHTML = '';
                audioPlayback.src = '';
            });

            // Speak button click handler
            speakButton.addEventListener('click', async function() {
                audioPlayback.play();
            });

            // Save button click handler
            saveButton.addEventListener('click', function() {
                const conversationText = messages.map(msg => {
                    if (msg.role === 'system') return '';
                    return `${msg.role === 'user' ? 'You' : 'Assistant'}: ${msg.content}\n`;
                }).join('\n');
                
                const blob = new Blob([conversationText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'conversation.txt';
                a.click();
                URL.revokeObjectURL(url);
            });

            // Start recording function
            async function startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };
                    
                    mediaRecorder.onstop = processAudio;
                    
                    mediaRecorder.start();
                    isRecording = true;
                    recordButton.textContent = '⏹️ Stop';
                    recordButton.classList.add('recording');
                    
                    // Start timer
                    startTimer();
                    
                    // Show recording animation
                    const langDisplay = languageSelect.options[languageSelect.selectedIndex].text;
                    showRecordingAnimation(langDisplay);
                    
                    // If not continuous, set timeout to stop recording
                    if (!isContinuous && recordingDuration > 0) {
                        setTimeout(() => {
                            if (isRecording) {
                                stopRecording();
                            }
                        }, recordingDuration * 1000);
                    }
                    
                } catch (error) {
                    showStatus('Microphone access denied or not available', 'error');
                    console.error('Recording error:', error);
                }
            }

            // Stop recording function
            function stopRecording() {
                if (mediaRecorder && isRecording) {
                    mediaRecorder.stop();
                    isRecording = false;
                    recordButton.textContent = '🎙️ Record';
                    recordButton.classList.remove('recording');
                    showStatus('Processing audio...', 'loading');
                    
                    // Stop timer
                    stopTimer();
                }
            }

            // Timer functions
            function startTimer() {
                recordingStartTime = Date.now();
                recordingTimer.style.display = 'inline';
                recordingTimer.textContent = '00:00';
                
                timerInterval = setInterval(() => {
                    const elapsedTime = Math.floor((Date.now() - recordingStartTime) / 1000);
                    const minutes = Math.floor(elapsedTime / 60).toString().padStart(2, '0');
                    const seconds = (elapsedTime % 60).toString().padStart(2, '0');
                    recordingTimer.textContent = `${minutes}:${seconds}`;
                }, 1000);
            }
            
            function stopTimer() {
                clearInterval(timerInterval);
                setTimeout(() => {
                    recordingTimer.style.display = 'none';
                }, 2000);
            }

            // Process recorded audio
            async function processAudio() {
    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });

    const formData = new FormData();
    formData.append('audio_file', audioBlob, 'recording.wav');
    formData.append('lang', languageSelect.value);
    formData.append('speed', speedSelect.value);
    formData.append('volume', volumeInput.value);

    const response = await fetch('http://localhost:8000/process-speech', {
        method: 'POST',
        body: formData
    });

    if (!response.ok || !response.body) {
        showStatus('Server returned an error.', 'error');
        return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    const audioQueue = [];
    let isPlaying = false;

    async function playNext() {
        if (isPlaying || audioQueue.length === 0) return;
        isPlaying = true;

        const base64Audio = audioQueue.shift();
        const binary = Uint8Array.from(atob(base64Audio), c => c.charCodeAt(0));
        const blob = new Blob([binary], { type: 'audio/mp3' });
        audioPlayback.src = URL.createObjectURL(blob);
        speakButton.style.display = 'flex';
        audioPlayback.onended = () => {
            isPlaying = false;
            playNext();
        };
        audioPlayback.play();
    }

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");

        for (let i = 0; i < parts.length - 1; i++) {
            const lines = parts[i].split("\n").filter(Boolean);
            const eventType = lines[0].split(": ")[1];
            const dataLine = lines.find(line => line.startsWith("data: "));
            if (!dataLine) continue;
            const data = JSON.parse(dataLine.replace("data: ", ""));

            if (eventType === 'start') {
                addMessage('user', data.transcription);
                messages.push({ role: 'user', content: data.transcription });
            } else if (eventType === 'chunk') {
                addMessage('assistant', data.text);
                messages.push({ role: 'assistant', content: data.text });
                audioQueue.push(data.audio);
                playNext();
            } else if (eventType === 'end') {
                showStatus('');
            }
        }

        buffer = parts[parts.length - 1];
    }
}

            // Add message to chat
            function addMessage(role, content) {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${role}-message`;
                
                const headerElement = document.createElement('div');
                headerElement.className = 'message-header';
                headerElement.textContent = role === 'user' ? '👤 You:' : '🤖 Assistant:';
                
                const contentElement = document.createElement('div');
                contentElement.className = 'message-content';
                contentElement.textContent = content;
                
                messageElement.appendChild(headerElement);
                messageElement.appendChild(contentElement);
                
                chatContainer.appendChild(messageElement);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            // Show recording animation
            function showRecordingAnimation(language) {
                showStatus(`Recording in ${language}...`, 'recording');
            }

            // Show status with optional loading animation
            function showStatus(message, type = '') {
                if (!message) {
                    statusContainer.innerHTML = '';
                    return;
                }
                
                let html = message;
                
                if (type === 'loading') {
                    html += '<div class="loading-dots"><div></div><div></div><div></div></div>';
                } else if (type === 'recording') {
                    html = `
                        <div class="wave-container">
                            <div class="wave-bar" style="animation-delay: -0.4s"></div>
                            <div class="wave-bar" style="animation-delay: -0.3s"></div>
                            <div class="wave-bar" style="animation-delay: -0.2s"></div>
                            <div class="wave-bar" style="animation-delay: -0.1s"></div>
                            <div class="wave-bar" style="animation-delay: 0s"></div>
                        </div>
                        ${message}
                    `;
                }
                
                statusContainer.innerHTML = html;
            }
        });
    </script>
</body>
</html>
